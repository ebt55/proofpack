# Coaching (for Parents/Spouse) — checklist definition
# Questions follow the NY OPWDD Self-Direction pre-approval form for this category.

category: coaching
display_name: Coaching (for Parents/Spouse)
form_title_hints:
  - "Coaching for Parents/Spouse"
  - "Coaching Pre-approval"

adults_only: true   # "Is the individual over 18?" — checked deterministically from the form age

fee_caps:
  - id: cap_group_class
    label: "Tuition ≤ $55 per group class"
    max_amount: 55
    unit_keywords: ["class"]
  - id: cap_private_class
    label: "Tuition ≤ $111 per private class"
    max_amount: 111
    unit_keywords: ["private"]
  - id: cap_program_year
    label: "Program capped at $500 per year"
    max_amount: 500
    unit_keywords: ["course", "year", "annual"]

notes:
  - "Educational opportunities for parents/spouses that help the individual achieve Life Plan goals."
  - "May include registration/conference fees. Overnight lodging or travel is NOT reimbursable."

items:
  - id: published_fees
    form_question: "(program guideline) Published fees exist for the course/class"
    requirement: "Published fees exist for the course/class on the provider's website"
    kind: website
    check_hint: >
      Find a public dollar price for the course or classes (per class and/or per course). A
      brochure PDF with prices linked from the site also counts — record the URL.

  - id: educational_content
    form_question: "(program guideline) Content is a genuine educational/coaching opportunity"
    requirement: "Content is a genuine educational/coaching opportunity (not lodging/travel)"
    kind: website
    check_hint: >
      Confirm the offering is an educational course/workshop/coaching program (e.g. parenting
      classes) rather than travel, lodging, retreats or entertainment.

  # ---- internal items ----

  - id: budget_approved
    form_question: "Is coaching education currently approved in the budget?"
    kind: internal
    internal_reason: "Participant budget data lives in internal systems."

  - id: over_18
    form_question: "Is the individual over 18?"
    kind: internal
    internal_reason: "Checked deterministically from the form's stated age (see fee/eligibility checks) — official proof of age is internal."

  - id: addresses_lp_goals
    form_question: "Does the coaching address the individual's goals being worked on in the LP?"
    kind: internal
    internal_reason: "Requires the participant's Life Plan."

  - id: other_funding
    form_question: "Can the coaching program be funded by other public programs?"
    kind: internal
    internal_reason: "Requires knowledge of other funding sources for this participant."
